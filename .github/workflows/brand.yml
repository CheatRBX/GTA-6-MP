name: brand

# Логотип (SVG → PNG), загрузочная анимация, проверка архива и превью.
on:
  push:
    paths: ["brand/**", ".github/workflows/brand.yml"]
  pull_request:
    paths: ["brand/**", ".github/workflows/brand.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2
          pip install pillow numpy cairosvg

      - name: Logo
        run: python3 brand/tools/logo.py --sheet brand/out/logo-variants.png

      - name: Boot animation
        run: |
          python3 brand/bootanim/build.py \
            --preview brand/out/bootanimation-preview.mp4 \
            --gif brand/out/bootanimation-preview.gif

      - name: Check boot animation
        run: python3 brand/bootanim/check.py brand/out/bootanimation.zip

      - uses: actions/upload-artifact@v5
        with:
          name: brand
          path: brand/out/
          if-no-files-found: error
