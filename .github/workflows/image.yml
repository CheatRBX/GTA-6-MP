name: image

# Сборка GSI Corax OS: берём готовый LineageOS 24 GSI (image/base.json), кладём в него
# загрузочную анимацию Corax, Corax Центр (системное приложение) и метки версии,
# доказываем, что изменилось только наше, и выдаём образ + установщики.
on:
  push:
    paths: ["image/**", "installer/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gsi:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs android-sdk-libsparse-utils xz-utils attr jq libcairo2 zip
          pip install pillow numpy cairosvg

      # ---------- наши части ----------
      - name: Boot animation
        run: |
          python3 brand/bootanim/build.py
          python3 brand/bootanim/check.py brand/out/bootanimation.zip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Corax Center APK
        working-directory: apps
        run: ./gradlew :center:assembleDebug --console=plain

      # ---------- базовый образ ----------
      - name: Download base GSI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo=$(jq -r .github_repo image/base.json)
          tag=$(jq -r .tag image/base.json)
          re=$(jq -r .asset_regex image/base.json)
          pinned=$(jq -r .sha256 image/base.json)
          gh api "repos/$repo/releases/tags/$tag" > release.json
          url=$(jq -r --arg re "$re" '[.assets[] | select(.name | test($re))][0].browser_download_url' release.json)
          [ "$url" != "null" ] || { echo "Нет файла по шаблону $re"; exit 1; }
          name=$(basename "$url")
          mkdir -p work
          curl -fL --retry 3 -o "work/$name" "$url"
          actual=$(sha256sum "work/$name" | cut -d' ' -f1)
          [ "$actual" = "$pinned" ] || { echo "SHA256 не совпал: $actual != $pinned"; exit 1; }
          echo "BASE=work/$name" >> "$GITHUB_ENV"
          echo "### Базовый GSI: \`$name\` (sha256 \`$actual\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Unpack base
        run: RAW_ONLY=1 bash image/repack.sh "$BASE" /dev/null work/base.img

      # ---------- оверлей ----------
      - name: Build overlay
        run: |
          echo "VERSION=$(jq -r .version brand/brand.json)" >> "$GITHUB_ENV"
          echo "STAMP=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          bash image/make-overlay.sh work/base.img overlay \
            apps/center/build/outputs/apk/debug/center-debug.apk brand/out/bootanimation.zip expected.txt
          cat expected.txt

      - name: Repack
        run: bash image/repack.sh "$BASE" overlay work/system.img

      - name: Verify (only our files changed)
        run: sudo bash image/verify.sh work/base.img work/system.img expected.txt

      # ---------- выпуск ----------
      - name: Package
        run: |
          out=CoraxOS-$VERSION-test-$STAMP-arm64_bvN
          mkdir -p dist
          xz -T0 -6 -c work/system.img > "dist/$out.img.xz"
          bash installer/build-zip.sh "dist/$out.img.xz" "dist/$out-installer.zip"
          cp installer/flash.sh installer/flash.bat dist/
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          {
            echo "### Corax OS $VERSION (тестовая сборка)"
            echo '```'; cat dist/SHA256SUMS; echo '```'
            echo "Размер образа: $(stat -c %s work/system.img) байт"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: corax-os-gsi-test
          path: dist/
          retention-days: 14
          compression-level: 0
